<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保存 SP 配套扩展</title>
  <link rel="stylesheet" href="./assets/settings.css">
  <script type="module" src="./assets/companion-download.js"></script>
</head>
<body>
  <main class="page" id="companion-download" aria-busy="true">
    <h1>保存 SP 配套扩展</h1>
    <p class="lede">任务台附带的 Super Productivity 扩展。这里只保存安装包，不安装插件，也不改 SP 数据。</p>
    <p class="hint" id="companion-info">正在读取安装包信息…</p>
    <details class="fold" id="companion-details" hidden>
      <summary>SHA-256</summary>
      <p class="hint checksum" id="companion-checksum"></p>
    </details>
    <div class="row card-actions">
      <button type="button" class="btn" id="companion-save" disabled>选择位置并保存</button>
      <button type="button" class="btn btn-ghost" id="companion-refresh" hidden disabled>重新读取</button>
    </div>
    <p class="status block-status" id="companion-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <ol class="install-steps card-steps">
      <li>
        <h3>在 SP 中安装</h3>
        <p class="hint">SP「设置 → 插件」选择 <code>hana-sp-bridge.zip</code>，安装或更新并启用。</p>
      </li>
      <li>
        <h3>回任务台配对</h3>
        <p class="hint">在任务台设置里启用并配对。保存成功不代表已经安装或连接。</p>
      </li>
    </ol>
    <p class="hint card-note">保存需要允许任务台的 <code>app/resources.write</code>，保存位置由你在对话框里选。</p>
  </main>
</body>
</html>
